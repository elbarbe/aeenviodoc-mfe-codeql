<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h3 class="title">{{title}}</h3>
        <div class="piuRegion" [ngClass]="cssClasses">
            <imes-actionsnavigations [queryIU]="this"></imes-actionsnavigations>
            <div class="filter col-12 ">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item">
                        <a (click)="setActiveFilterIndex(0)" class="nav-link"
                            [ngClass]="{'active': activeFilter && activeFilter.index == 0}" role="tab" tabindex
                            data-bs-toggle="tab">{{f0.title}}
                            <button *ngIf="activeFilter && activeFilter.index == 0 && hideFilters && activeFilterIsHidden" [ngClass]="getShowFilterCSSClass()" (click)="showCurrentFilter()"
                                aria-label="Show" title="Show"></button>
                            <button *ngIf="activeFilter && activeFilter.index == 0 && hideFilters && !activeFilterIsHidden" [ngClass]="getHideFilterCSSClass()" (click)="hideCurrentFilter()"
                                aria-label="Hide" title="Hide"></button>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a (click)="setActiveFilterIndex(1)" class="nav-link"
                            [ngClass]="{'active': activeFilter && activeFilter.index == 1}" role="tab" tabindex
                            data-bs-toggle="tab">{{f1.title}}
                            <button *ngIf="activeFilter && activeFilter.index == 1 && hideFilters && activeFilterIsHidden" [ngClass]="getShowFilterCSSClass()" (click)="showCurrentFilter()"
                                aria-label="Show" title="Show"></button>
                            <button *ngIf="activeFilter && activeFilter.index == 1 && hideFilters && !activeFilterIsHidden" [ngClass]="getHideFilterCSSClass()" (click)="hideCurrentFilter()"
                                aria-label="Hide" title="Hide"></button>
                        </a>
                    </li>
                </ul>
                <div *ngIf="!hideFilters || !activeFilterIsHidden" class="tab-content filterContent">
                        <div class="tab-pane" [ngClass]=" {'active': activeFilter && activeFilter.index == 0}" role="tabpanel">
                            <div class="filterVariables">
                            <imes-lensesearch [field]="f0.vouPersona" *ngIf="f0.vouPersona.visible"
                                (selected)="f0.processvoupersonaSelected($event)" (cleared)="f0.cleanvoupersona()"
                                (keypressLenseSearch)="f0.onKeypressLenseSearch('onvoupersonaChange')"
                                (searched)="f0.doSearchAction('vouPersona')"></imes-lensesearch>
                                <imes-input-date [field]="f0.vuFIni" *ngIf="f0.vuFIni.visible"></imes-input-date>
                                <imes-input-date [field]="f0.vuFFin" *ngIf="f0.vuFFin.visible"></imes-input-date>
                            </div>
                            <div class="filterButtons">
                                <button class="btn btn-outline-secondary btn-sm pi pi-search" (click)="f0.search()"
                                    aria-label="Search"></button>
                                <button class="btn btn-outline-secondary btn-sm pi pi-trash" (click)="f0.clean()"
                                    aria-label="Clean"></button>
                            </div>
                        </div>
                        <div class="tab-pane" [ngClass]=" {'active': activeFilter && activeFilter.index == 1}" role="tabpanel">
                            <div class="filterVariables">
                                <imes-input-string [field]="f1.vuNumSolicitud" *ngIf="f1.vuNumSolicitud.visible"></imes-input-string>
                                <imes-input-date [field]="f1.vuFIni" *ngIf="f1.vuFIni.visible"></imes-input-date>
                                <imes-input-date [field]="f1.vuFFin" *ngIf="f1.vuFFin.visible"></imes-input-date>
                            </div>
                            <div class="filterButtons">
                                <button class="btn btn-outline-secondary btn-sm pi pi-search" (click)="f1.search()"
                                    aria-label="Search"></button>
                                <button class="btn btn-outline-secondary btn-sm pi pi-trash" (click)="f1.clean()"
                                    aria-label="Clean"></button>
                            </div>
                        </div>
                </div>
            </div>
            <imes-grid [piu]="this"></imes-grid>
        </div>
        <imes-piubuttons [piu]="this"></imes-piubuttons>
    </ng-container>
</form>
